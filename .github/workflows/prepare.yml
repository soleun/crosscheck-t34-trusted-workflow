# RND-4084 [spec/559-rnd-4043 T322] — trusted merchant-app preparation workflow.
#
# Callable ONLY via `workflow_call` from a merchant repo. CrossCheck never
# dispatches this workflow and never writes to the merchant repository: the
# merchant repo calls it, GitHub runs it, and CrossCheck verifies the
# evidence (OIDC identity, attestations, receipt) afterwards.
#
# Trust boundary: jobs `source`/`attest`/`upload` run only the pinned
# template code (`prepare.py`, stdlib python) plus pinned GitHub actions.
# Only `build` executes merchant-controlled bytes (`npm ci` with
# `--ignore-scripts`, then the enrolled build recipe), and `build` holds no
# secret and mints no identity. `attest` re-derives the output digest from
# the bytes rather than trusting `build`'s claim.
#
# Permission notes (least-privilege; every grant is load-bearing):
# - `source` holds `contents: read` only: it checks out the merchant repo at
#   the pinned commit and the trusted template at `trusted_template_ref`.
#   Same-run `upload-artifact` calls authenticate with the job's runtime
#   token, so no `actions` permission is needed to publish `source-archive`
#   and `template-archive`.
# - `build` holds `permissions: {}` and performs no checkout: it downloads
#   `source-archive` and `template-archive` with the job's runtime token,
#   verifies both sha256 digests against `needs.source.outputs` before
#   extracting, then runs the enrolled build recipe from the extracted bytes.
#   It holds no `id-token` and touches no `secrets.*`, so a compromised
#   build cannot mint the upload identity or exfiltrate the App Automation
#   Token. (Under `permissions: {}` the `GITHUB_TOKEN` cannot read a private
#   repo, which is why `build` must not check anything out.)
# - `attest` holds `id-token: write` (mint the attestation identity),
#   `attestations: write` (write the build-provenance attestation) and
#   `contents: read` (check out the trusted template that ships
#   `prepare.py`). Its same-run `download-artifact` needs no `actions`
#   permission.
# - `upload` holds `id-token: write` (mint the upload OIDC token),
#   `attestations: write` (attest the receipt) and `contents: read`
#   (check out the trusted template that ships `prepare.py`). Its same-run
#   downloads need no `actions` permission. The deploy step carries an
#   explicit `env:` allowlist; nothing else from the environment reaches
#   the CLI.
name: crosscheck-merchant-app-prepare

on:
  workflow_call:
    inputs:
      commit_sha:
        description: Full 40-hex commit SHA the merchant app is built from.
        required: true
        type: string
      app_root:
        description: Safe relative path of the app inside the merchant repo.
        required: true
        type: string
      config_name:
        description: Shopify config name (shopify.app.<config>.toml).
        required: true
        type: string
      client_id:
        description: Expected app client_id; policy-check refuses anything else.
        required: true
        type: string
      baseline_json:
        description: Enrolled source-manifest JSON (TOML set + extension inventory).
        required: true
        type: string
      claim_mode:
        description: "'live' mints a claim and deploys; 'recording' never touches Shopify."
        required: true
        type: string
      claim_url:
        description: CrossCheck claim endpoint. Empty when claim_mode is recording.
        required: true
        type: string
      deploy_run_id:
        description: CrossCheck deploy run id this preparation belongs to.
        required: true
        type: string
      workspace_id:
        description: CrossCheck workspace id owning the enrolled app binding.
        required: true
        type: string
      app_binding_id:
        description: Enrolled merchant-app binding id.
        required: true
        type: string
      generation:
        description: Deploy generation (positive integer).
        required: true
        type: number
      requested_version:
        description: Requested app version name (opaque argv value).
        required: true
        type: string
      source_control_url:
        description: Source-control URL recorded on the deployed version.
        required: true
        type: string
      oidc_audience:
        description: OIDC audience CrossCheck verifies.
        required: false
        default: crosscheck-merchant-upload
        type: string
      node_version:
        description: Enrolled Node toolchain version.
        required: true
        type: string
      trusted_template_repo:
        description: Owner/repo holding this template (prepare.py source of truth).
        required: true
        type: string
      trusted_template_ref:
        description: Full SHA of the trusted template revision.
        required: true
        type: string
      trusted_workflow_ref:
        description: Enrolled trusted workflow identity recorded in the receipt.
        required: true
        type: string
    secrets:
      SHOPIFY_APP_AUTOMATION_TOKEN:
        description: App-scoped App Automation Token (environment secret, shopify-upload).
        required: false

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      source_archive_digest: ${{ steps.manifest.outputs.source_archive_digest }}
      source_archive_sha256: ${{ steps.digests.outputs.source_archive_sha256 }}
      template_archive_sha256: ${{ steps.digests.outputs.template_archive_sha256 }}
    steps:
      - name: Check out the merchant repo at the pinned commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false
          submodules: false
          lfs: false
          fetch-depth: 1

      - name: Check out the trusted template
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ${{ inputs.trusted_template_repo }}
          ref: ${{ inputs.trusted_template_ref }}
          path: crosscheck-template
          persist-credentials: false
          submodules: false
          lfs: false

      - name: Emit the source manifest
        id: manifest
        run: |
          python3 crosscheck-template/templates/shopify-merchant-app/prepare.py source-manifest \
            --repo "$GITHUB_WORKSPACE" \
            --commit "${{ inputs.commit_sha }}" \
            --app-root "${{ inputs.app_root }}" \
            --config-name "${{ inputs.config_name }}" \
            > source-manifest.json
          python3 -c "import json; print('source_archive_digest=' + json.load(open('source-manifest.json'))['sourceArchiveDigest'])" >> "$GITHUB_OUTPUT"

      - name: Policy-check against the enrolled baseline
        env:
          BASELINE_JSON: ${{ inputs.baseline_json }}
        run: |
          printf '%s' "$BASELINE_JSON" > baseline.json
          python3 crosscheck-template/templates/shopify-merchant-app/prepare.py policy-check \
            --baseline baseline.json \
            --manifest source-manifest.json \
            --client-id "${{ inputs.client_id }}"

      - name: Archive the enrolled source tree
        run: |
          git archive -o source-archive.tar.gz "${{ inputs.commit_sha }}" -- "${{ inputs.app_root }}"

      - name: Archive the trusted template tree (deterministic tar)
        run: |
          tar --sort-name --owner=0 --group=0 --numeric-owner --mtime='2000-01-01' \
            --exclude='.git' -cf template-archive.tar -C crosscheck-template .

      - name: Digest both archives
        id: digests
        run: |
          printf 'source_archive_sha256=%s\n' "$(sha256sum source-archive.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          printf 'template_archive_sha256=%s\n' "$(sha256sum template-archive.tar | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload the source archive and manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: source-archive
          path: |
            source-archive.tar.gz
            source-manifest.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload the template archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: template-archive
          path: template-archive.tar
          if-no-files-found: error
          retention-days: 7

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [source]
    permissions: {}
    steps:
      - name: Download the source archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: source-archive
          path: source-archive

      - name: Download the template archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: template-archive
          path: template-archive

      - name: Verify both archive digests before extraction
        run: |
          test "$(sha256sum source-archive/source-archive.tar.gz | cut -d' ' -f1)" = "${{ needs.source.outputs.source_archive_sha256 }}"
          test "$(sha256sum template-archive/template-archive.tar | cut -d' ' -f1)" = "${{ needs.source.outputs.template_archive_sha256 }}"

      - name: Extract the source and template archives
        run: |
          tar -xzf source-archive/source-archive.tar.gz
          mkdir -p crosscheck-template
          tar -xf template-archive/template-archive.tar -C crosscheck-template

      - name: Set up the enrolled Node toolchain
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ inputs.node_version }}
          cache: npm
          cache-dependency-path: ${{ inputs.app_root }}/package-lock.json

      - name: Install merchant dependencies without lifecycle scripts
        working-directory: ${{ inputs.app_root }}
        run: |
          npm ci --ignore-scripts

      - name: Run the enrolled build recipe
        working-directory: ${{ inputs.app_root }}
        run: |
          npm run build

      - name: Emit the output manifest and toolchain record
        run: |
          printf '%s' "$BASELINE_JSON" > baseline.json
          python3 crosscheck-template/templates/shopify-merchant-app/prepare.py output-manifest \
            --build-dir "${{ inputs.app_root }}" \
            --baseline baseline.json \
            > output-manifest.json
          node --version > toolchain.txt
          npm --version >> toolchain.txt
          python3 -c "import json; print(json.load(open('crosscheck-template/templates/shopify-merchant-app/cli/package.json'))['dependencies'])" >> toolchain.txt
        env:
          BASELINE_JSON: ${{ inputs.baseline_json }}

      - name: Upload the build payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: build-output
          path: ${{ inputs.app_root }}
          if-no-files-found: error
          retention-days: 7

      - name: Upload the build metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: build-meta
          path: |
            output-manifest.json
            toolchain.txt
          if-no-files-found: error
          retention-days: 7

  attest:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [build]
    permissions:
      id-token: write
      attestations: write
      contents: read
    outputs:
      build_output_digest: ${{ steps.redigest.outputs.build_output_digest }}
    steps:
      - name: Check out the trusted template
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ${{ inputs.trusted_template_repo }}
          ref: ${{ inputs.trusted_template_ref }}
          path: crosscheck-template
          persist-credentials: false
          submodules: false
          lfs: false

      - name: Download the build payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-output
          path: build-output

      - name: Re-derive the output digest (no merchant code runs here)
        id: redigest
        env:
          BASELINE_JSON: ${{ inputs.baseline_json }}
        run: |
          printf '%s' "$BASELINE_JSON" > baseline.json
          python3 crosscheck-template/templates/shopify-merchant-app/prepare.py output-manifest \
            --build-dir build-output \
            --baseline baseline.json \
            > output-manifest.redigest.json
          python3 -c "import json; print('build_output_digest=' + json.load(open('output-manifest.redigest.json'))['buildOutputDigest'])" >> "$GITHUB_OUTPUT"

      - name: Attest the build output digest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: output-manifest.redigest.json

  upload:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [source, attest]
    environment: shopify-upload
    permissions:
      id-token: write
      attestations: write
      contents: read
    outputs:
      upload_status: ${{ steps.receipt.outputs.upload_status }}
    steps:
      - name: Check out the trusted template
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ${{ inputs.trusted_template_repo }}
          ref: ${{ inputs.trusted_template_ref }}
          path: crosscheck-template
          persist-credentials: false
          submodules: false
          lfs: false

      - name: Download the build payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-output
          path: build-output

      - name: Download the build metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-meta
          path: build-meta

      - name: Download the source archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: source-archive
          path: source-archive

      - name: Install the pinned Shopify CLI without lifecycle scripts
        run: |
          npm ci --ignore-scripts --prefix crosscheck-template/templates/shopify-merchant-app/cli

      - name: Re-verify the output digest against the attested one
        env:
          BASELINE_JSON: ${{ inputs.baseline_json }}
          ATTESTED_DIGEST: ${{ needs.attest.outputs.build_output_digest }}
        run: |
          printf '%s' "$BASELINE_JSON" > baseline.json
          python3 crosscheck-template/templates/shopify-merchant-app/prepare.py output-manifest \
            --build-dir build-output \
            --baseline baseline.json \
            > output-manifest.verify.json
          python3 -c "import json,os,sys; got=json.load(open('output-manifest.verify.json'))['buildOutputDigest']; sys.exit(0 if got==os.environ['ATTESTED_DIGEST'] else (print('digest mismatch', file=sys.stderr) or 1))"

      - name: Mint the upload OIDC token
        if: inputs.claim_mode == 'live'
        run: |
          OIDC_TOKEN="$(curl -sS --max-time 30 -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=${{ inputs.oidc_audience }}" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          printf '%s' "$OIDC_TOKEN" > oidc-token.txt

      - name: Claim the upload (live only, single attempt, no retry)
        id: claim
        if: inputs.claim_mode == 'live'
        run: |
          python3 -c "import json; json.dump({'deployRunId': '${{ inputs.deploy_run_id }}', 'generation': ${{ inputs.generation }}, 'githubRunId': '${{ github.run_id }}', 'githubRunAttempt': '${{ github.run_attempt }}'}, open('claim-request.json', 'w'))"
          curl -sS --max-time 60 -X POST "${{ inputs.claim_url }}" \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer $(<oidc-token.txt)" \
            --data @claim-request.json \
            -o claim-response.json
          if python3 crosscheck-template/templates/shopify-merchant-app/prepare.py claim-gate \
            --response claim-response.json \
            --request claim-request.json; then
            printf 'granted=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'granted=false\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy the app version (live only, gated on the claim)
        if: inputs.claim_mode == 'live' && steps.claim.outputs.granted == 'true'
        env:
          SHOPIFY_APP_AUTOMATION_TOKEN: ${{ secrets.SHOPIFY_APP_AUTOMATION_TOKEN }}
          NO_COLOR: '1'
        run: |
          npx --no-install --prefix crosscheck-template/templates/shopify-merchant-app/cli shopify app deploy \
            --no-release \
            --no-build \
            --config "${{ inputs.config_name }}" \
            --path build-output \
            --version "${{ inputs.requested_version }}" \
            --source-control-url "${{ inputs.source_control_url }}"

      - name: List app versions (live only, gated on the claim)
        if: inputs.claim_mode == 'live' && steps.claim.outputs.granted == 'true'
        run: |
          npx --no-install --prefix crosscheck-template/templates/shopify-merchant-app/cli shopify app versions list \
            --config "${{ inputs.config_name }}" \
            --path build-output \
            --json > versions.json

      - name: Emit the build receipt
        id: receipt
        env:
          BASELINE_JSON: ${{ inputs.baseline_json }}
        run: |
          printf '%s' "$BASELINE_JSON" > baseline.json
          # The trusted workflow revision is this file's own revision: the
          # reusable workflow is versioned with the template, so the enrolled
          # trustedWorkflowSha equals trusted_template_ref. CrossCheck
          # re-verifies the run's actual workflow identity server-side.
          python3 -c "import json; json.dump({'workspaceId': '${{ inputs.workspace_id }}', 'deployRunId': '${{ inputs.deploy_run_id }}', 'appBindingId': '${{ inputs.app_binding_id }}', 'generation': ${{ inputs.generation }}, 'githubRepositoryId': '${{ github.repository_id }}', 'githubRunId': '${{ github.run_id }}', 'githubRunAttempt': '${{ github.run_attempt }}', 'trustedWorkflowSha': '${{ inputs.trusted_template_ref }}', 'sourceHash': json.load(open('source-archive/source-manifest.json'))['sourceArchiveDigest'], 'buildOutputDigest': json.load(open('output-manifest.verify.json'))['buildOutputDigest']}, open('claim.json', 'w'))"
          UPLOAD_STATUS=not_attempted
          if [ "${{ inputs.claim_mode }}" = "live" ] && [ "${{ steps.claim.outputs.granted }}" = "true" ]; then
            UPLOAD_STATUS=succeeded
          fi
          python3 crosscheck-template/templates/shopify-merchant-app/prepare.py receipt \
            --baseline baseline.json \
            --manifest source-archive/source-manifest.json \
            --output output-manifest.verify.json \
            --claim claim.json \
            --generation "${{ inputs.generation }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --workflow-ref "${{ inputs.trusted_workflow_ref }}" \
            --artifact-id build-output \
            --artifact-digest "$(python3 -c "import hashlib; print(hashlib.sha256(open('output-manifest.verify.json','rb').read()).hexdigest())")" \
            --image-digest "$(python3 -c "import hashlib; print(hashlib.sha256(open('/etc/os-release','rb').read()).hexdigest())")" \
            --toolchain-digest "$(python3 -c "import hashlib; print(hashlib.sha256(open('build-meta/toolchain.txt','rb').read()).hexdigest())")" \
            --cli-version "$(python3 -c "import json; print(json.load(open('crosscheck-template/templates/shopify-merchant-app/cli/package.json'))['dependencies']['@shopify/cli'])")" \
            --build-status succeeded \
            --upload-status "$UPLOAD_STATUS" \
            --out receipt.json
          printf 'upload_status=%s\n' "$UPLOAD_STATUS" >> "$GITHUB_OUTPUT"

      - name: Attest the receipt digest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: receipt.json
